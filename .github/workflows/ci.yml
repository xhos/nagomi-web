name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: flake checks
        run: nix flake check --accept-flake-config
      - name: build deployable package
        run: nix build --no-link --accept-flake-config

  notify:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NAGOMI_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'xhos',
              repo: 'nagomi',
              workflow_id: 'update-input.yml',
              ref: 'main',
              inputs: { input: 'nagomi-web' },
            });
